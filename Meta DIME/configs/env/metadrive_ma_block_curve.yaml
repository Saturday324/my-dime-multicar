#@package _global_
# Single Curve block through MultiAgentComposedEnv.
env_name: metadrive/MultiAgentComposedEnv
eval_enabled: false

env_kwargs:
  use_render: false
  start_seed: 0
  num_scenarios: 1
  horizon: 1000

  map: C
  map_config:
    exit_length: 60
    lane_num: 2

  num_agents: 8
  allow_respawn: true
  delay_done: 5

  traffic_density: 0.1
  random_traffic: false
  need_inverse_traffic: false
  traffic_mode: basic
  traffic_policy: expert
  traffic_expert_ratio: 0.5
  traffic_vehicle_config:
    show_navi_mark: false
    show_dest_mark: false
    enable_reverse: false
    show_lidar: false
    show_lane_line_detector: false
    show_side_detector: false
    use_special_color: false
    random_color: true
    fixed_color: [0.45, 0.45, 0.45]

  driving_reward: 1.0
  speed_reward: 0.1
  use_lateral_reward: true
  lateral_reward_min: 0.5
  success_reward: 10.0
  out_of_road_penalty: 10.0
  crash_vehicle_penalty: 5.0
  crash_object_penalty: 5.0
  crash_sidewalk_penalty: 0.0

  proximity_penalty_enabled: true
  proximity_threshold: 10.0
  proximity_penalty_max: 2.0
  proximity_euclidean_threshold: 1.5
  proximity_euclidean_penalty_max: 2.0

  crash_done: true
  out_of_road_done: true

  vehicle_config:
    use_special_color: false
    random_color: true
    lidar:
      num_lasers: 120
      distance: 50
      num_others: 6
      add_others_navi: true
      gaussian_noise: 0.0
      dropout_prob: 0.0
    side_detector:
      num_lasers: 0
      distance: 50
      gaussian_noise: 0.0
      dropout_prob: 0.0
    lane_line_detector:
      num_lasers: 0
      distance: 20
      gaussian_noise: 0.0
      dropout_prob: 0.0
